<!DOCTYPE html> <html> <head>   <title>User List</title> </head> <body>  <h2>Registered Users</h2>  <div id="list"></div>  <script> let users = JSON.parse(localStorage.getItem("users")) || [];  let html = "";  users.forEach(u => {   html += `     <p>       <b>${u.name}</b><br>       ${u.email}<br> ${u.mobile}<br> ${u.city} </p> <hr> `; }); document.getElementById("list").innerHTML = html; </script> </body> </html>

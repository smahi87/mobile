<!DOCTYPE html> <html> <head>   <title>Login</title> </head> <body>  <h2>Login</h2>  <input id="email" placeholder="Email"><br> <input id="password" type="password" placeholder="Password"><br>  <button onclick="login()">Login</button>  <script> function login() {   const email = document.getElementById("email").value;   const password = document.getElementById("password").value;    if (!email || !password) {     alert("Enter email and password");     return;   }    let users = JSON.parse(localStorage.getItem("users")) || [];    const found = users.find(u => u.email === email);    if (found) {     alert("Login success");     window.location.href = "list.html";   } else {     alert("User not found");   } } </script>  </body> </html>

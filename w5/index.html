<!DOCTYPE html>
<html>
<head>
  <title>Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      padding-top: 70px;
    }
    .product-card img {
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>

<body>

     <div class="container-fluid mb-2">

          <div class="row">

            <div class="col-md-3 sidebar">
              <h3>Filter</h3>
              
              <button class="btn btn-light w-100 " onclick="filter('all')">All</button>
              <button class="btn btn-light w-100 mb-2" onclick="filter('electronics')">Electronics</button>
              <button class="btn btn-light w-100 mb-2" onclick="filter('clothing')">Clothing</button>
              <button class="btn btn-light w-100 mb-2" onclick="filter('mugs')">mugs</button>
              
            </div>

            <div class="col-md-9 products">
             
              
                 <input class="form-control mt-4 row-md-7" type="text" placeholder="search" onkeyup="search()">
               

               <div class="dropdown mt-2 mb-2">
                 <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
                        Sort
                 </button>

                 <ul class="dropdown-menu">
                         <li><a class="dropdown-item">Price Low-High</a></li>
                         <li><a class="dropdown-item">Price High-Low</a></li>
                 </ul>
                </div>

                <div class="row">
                   
                <div class="col-md-4 item" data-cat="mugs">
                    <div class="card product-card">
                      <img src="images/speaker.jpg">
                      <div class="card-body">
                        <h4>White Mug</h4>
                        <p>$25</p>
                      </div>
                    </div>
                </div>

                 <div class="col-md-4 item" data-cat="mugs">
                    <div class="card product-card">
                      <img src="images/speaker.jpg">
                      <div class="card-body">
                        <h4>Black Mug</h4>
                        <p>$35</p>
                      </div>
                    </div>
                </div>

                 <div class="col-md-4 item" data-cat="clothing">
                    <div class="card product-card">
                      <img src="images/speaker.jpg">
                      <div class="card-body">
                        <h4>T-Shirt</h4>
                        <p>$20</p>
                      </div>
                    </div>
                </div>

                 <div class="col-md-4 item" data-cat="electronics">
                    <div class="card product-card">
                      <img src="images/speaker.jpg">
                      <div class="card-body">
                        <h4>speaker</h4>
                        <p>$125</p>
                      </div>
                    </div>
                </div>

                 <div class="col-md-4 item" data-cat="electronics">
                    <div class="card product-card">
                      <img src="images/speaker.jpg">
                      <div class="card-body">
                        <h4>Mobile</h4>
                        <p>$225</p>
                      </div>
                    </div>
                  </div>

              </div>

             
              


              </div>  


              </div>  
              
  </div> 
  
   <script>
       /* ✅ FILTER FUNCTION */
         function filter(cat){
            let items = document.querySelectorAll(".item");
            
            items.forEach(i =>{
              if(cat == "all" || i.dataset.cat === cat){
                i.style.display="block";
              }
              else{
                i.style.display ="none";
              }
            });

         }


         function search(){

          let input = document.querySelector("input").value.toLowerCase();
          let items = document.querySelectorAll('.item');

          items.forEach(i =>{
            let title = i.querySelector('h4').innerText.toLowerCase();

            if(title.includes(input)){
              i.style.display="block";
            }
            else{
              i.style.display ="none";
            }
          });
         }


</script>

</body>
</html>

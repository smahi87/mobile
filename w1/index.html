<!-- W1 Develop a responsive product catalog webpage using HTML, CSS, andJavaScript.
The webpage should display products in a table format with imagesand implement 
pagination if there are more than 10 products.-->

<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Product Catalog</h1>

<table id="productTable">
    <thead>
        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Price (₹)</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
</table>

<div class="pagination">
    <button onclick="prev()">⬅️ Previous</button>
    <span id="pageInfo"></span>
    <button onclick="next()">Next ➡️</button>
</div>

<script src="script.js"></script>

</body>
</html>
